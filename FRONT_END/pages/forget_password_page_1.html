<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 25px;
            padding: 40px 35px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            margin-right: 15px;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .lock-icon::before {
            content: '';
            width: 35px;
            height: 25px;
            border: 4px solid #fff;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            position: absolute;
            top: 15px;
        }

        .lock-icon::after {
            content: '';
            width: 45px;
            height: 30px;
            background: #fff;
            border-radius: 8px;
            position: absolute;
            bottom: 15px;
        }

        .check-mark {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            border: 3px solid white;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            background: #f8f9fa;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #ffd700;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .try-another {
            text-align: center;
            margin: 25px 0;
        }

        .try-another-link {
            color: #ff6b35;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .try-another-link:hover {
            color: #e55a2b;
            text-decoration: underline;
        }

        .send-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            border: none;
            border-radius: 15px;
            padding: 18px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .title {
                font-size: 16px;
            }
            
            .lock-icon {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <button class="back-btn" id="back-button">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="title">Forgot Password</h1>
        </div>

        <div class="icon-container">
            <div class="lock-icon">
                <div class="check-mark">
                    <i class="fas fa-question"></i>
                </div>
            </div>
        </div>

        <p class="description">
            Please Enter Your Email Address To<br>
            Recieve a Verification Cord.
        </p>

        <form id="forgot-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input 
                    type="email" 
                    class="form-input" 
                    placeholder="@gmail.com"
                    id="email-input"
                    required
                >
            </div>

            <!-- <div class="try-another">
                <a href="#" class="try-another-link">Try another way</a>
            </div> -->

            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>

    <script>
        // Document ready function using jQuery
        $(document).ready(function() {
            // Back button click event
            $('#back-button').click(function() {
                goBack();
            });
            
            // Form submission event
            $('#forgot-form').submit(function(event) {
                event.preventDefault();
                sendVerificationCode();
            });
            
            // Input focus effect using jQuery
            $('.form-input').focus(function() {
                $(this).css('border-color', '#ffd700');
            }).blur(function() {
                $(this).css('border-color', '#e0e0e0');
            });
        });

        function goBack() {
            // Navigate back to login page
            window.location.href = '/index.html';
        }

        function sendVerificationCode() {
            const email = $('#email-input').val();
            
            if (!email) {
                alert('Please enter your email address.');
                return;
            }

            if (!isValidEmail(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            // Show loading state with jQuery
            const btn = $('.send-btn');
            const originalText = btn.text();
            btn.text('Sending...');
            btn.prop('disabled', true);

            // Simulate API call
            setTimeout(() => {
                btn.text(originalText);
                btn.prop('disabled', false);
                
                // Store email for next page
                localStorage.setItem('resetEmail', email);
                
                alert('Verification code sent successfully! Navigating to verify page...');
                // Navigate to verify email page
                // window.location.href = '/verify-email.html';
            }, 2000);
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>
</html>
