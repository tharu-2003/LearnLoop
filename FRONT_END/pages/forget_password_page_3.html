<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/AppIcon.png" style="border-radius: 100px;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/forget_password_page_3.css">
</head>
<body>
    <!-- Main container for the password reset form -->
    <div class="container">
        <!-- Header section with title -->
        <div class="header">
            <h1 class="title">Create New Password</h1>
        </div>

        <!-- Lock icon with checkmark -->
        <div class="icon-container">
            <div class="lock-icon">
                <div class="check-mark">
                    <i class="fas fa-check"></i>
                </div>
            </div>
        </div>

        <!-- Description text -->
        <p class="description">
            Your New Password Must Be Different<br>
            from Previously Used Password.
        </p>

        <!-- Password reset form -->
        <form id="password-form">
            <!-- New password input field -->
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="password-input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="new-password"
                        required
                    >
                    <!-- Toggle password visibility button -->
                    <button type="button" class="toggle-password" id="toggle-new-password">
                        <i class="fas fa-eye" id="eye-new"></i>
                    </button>
                </div>
                <!-- Password strength indicator (hidden by default) -->
                <div class="password-strength" id="strength-indicator" style="display: none;">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                    <div class="strength-text" id="strength-text"></div>
                </div>
                <!-- Error message container -->
                <div class="error-message" id="new-password-error"></div>
            </div>

            <!-- Confirm password input field -->
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="password-input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="confirm-password"
                        required
                    >
                    <!-- Toggle password visibility button -->
                    <button type="button" class="toggle-password" id="toggle-confirm-password">
                        <i class="fas fa-eye" id="eye-confirm"></i>
                    </button>
                </div>
                <!-- Error message container -->
                <div class="error-message" id="confirm-password-error"></div>
            </div>

            <!-- Success message (hidden by default) -->
            <div class="success-message" id="success-message">
                Password updated successfully! You can now sign in with your new password.
            </div>

            <!-- Save button (disabled by default) -->
            <button type="submit" class="save-btn" id="save-btn" disabled>Save</button>
        </form>
    </div>

    <script>
        // Document ready function ensures code runs after DOM is fully loaded
        $(document).ready(function() {
            // Cache jQuery selectors for performance
            const $newPassword = $('#new-password');
            const $confirmPassword = $('#confirm-password');
            const $strengthIndicator = $('#strength-indicator');
            const $strengthFill = $('#strength-fill');
            const $strengthText = $('#strength-text');
            const $saveBtn = $('#save-btn');
            const $newPasswordError = $('#new-password-error');
            const $confirmPasswordError = $('#confirm-password-error');
            const $successMessage = $('#success-message');
            const $toggleNewPassword = $('#toggle-new-password');
            const $toggleConfirmPassword = $('#toggle-confirm-password');
            const $eyeNew = $('#eye-new');
            const $eyeConfirm = $('#eye-confirm');


            function getEmail() {
                const urlParams = new URLSearchParams(window.location.search);
                const email = urlParams.get('email');
                const expires = urlParams.get('expires');

                if (!expires || Date.now() > parseInt(expires)) {
                    alert("Reset link has expired!");
                    $('#password-form').hide(); // hide form if expired
                    return null;
                }

                return email;
            }



            
            // Event handler for new password input
            $newPassword.on('input', function() {
                const password = $(this).val();
                hideErrorMessages();
                
                // Hide strength indicator if password is empty
                if (password.length === 0) {
                    $strengthIndicator.hide();
                    updateSaveButton();
                    return;
                }
                
                // Show and update password strength indicator
                $strengthIndicator.show();
                const strength = calculatePasswordStrength(password);
                updatePasswordStrength(strength);
                
                // Validate password meets minimum length requirement
                if (password.length < 8) {
                    showError($newPasswordError, 'Password must be at least 8 characters long');
                }
                
                updateSaveButton();
            });
            
            // Event handler for confirm password input
            $confirmPassword.on('input', function() {
                hideErrorMessages();
                validatePasswordMatch();
                updateSaveButton();
            });
            
            // Toggle password visibility for new password field
            $toggleNewPassword.on('click', function() {
                togglePassword($newPassword, $eyeNew);
            });
            
            // Toggle password visibility for confirm password field
            $toggleConfirmPassword.on('click', function() {
                togglePassword($confirmPassword, $eyeConfirm);
            });
            
            // Form submission handler
            $('#password-form').on('submit', function(event) {
                event.preventDefault();
                savePassword();
            });
            
            // Initialize the save button state
            updateSaveButton();
            
        
            function calculatePasswordStrength(password) {
                let score = 0;
                
                // Add points based on password characteristics
                if (password.length >= 8) score += 25;
                if (/[a-z]/.test(password)) score += 25;
                if (/[A-Z]/.test(password)) score += 25;
                if (/[0-9]/.test(password)) score += 25;
                
                return score;
            }
            
        
            function updatePasswordStrength(strength) {
                // Remove all strength classes before adding new one
                $strengthFill.removeClass('strength-weak strength-fair strength-good strength-strong');
                
                // Update strength indicator based on score
                if (strength <= 25) {
                    $strengthFill.addClass('strength-weak');
                    $strengthText.text('Weak password').css('color', '#ff4757');
                } else if (strength <= 50) {
                    $strengthFill.addClass('strength-fair');
                    $strengthText.text('Fair password').css('color', '#ffa502');
                } else if (strength <= 75) {
                    $strengthFill.addClass('strength-good');
                    $strengthText.text('Good password').css('color', '#2ed573');
                } else {
                    $strengthFill.addClass('strength-strong');
                    $strengthText.text('Strong password').css('color', '#1dd1a1');
                }
            }
            
            /**
             * Validates that password and confirmation match
             * @returns {boolean} True if passwords match, false otherwise
             */
            function validatePasswordMatch() {
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                
                // Show error if passwords don't match
                if (confirmPassword.length > 0 && newPassword !== confirmPassword) {
                    showError($confirmPasswordError, 'Passwords do not match');
                    return false;
                }
                
                return true;
            }
            
            /**
             * Updates the state of the save button based on form validity
             */
            function updateSaveButton() {
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                const strength = calculatePasswordStrength(newPassword);
                
                // Enable button only if all validation criteria are met
                const isValid = newPassword.length >= 8 && 
                               newPassword === confirmPassword && 
                               confirmPassword.length > 0 &&
                               strength >= 50;
                
                $saveBtn.prop('disabled', !isValid);
            }
            
            /**
             * Toggles password visibility
             * @param {jQuery} $input - The password input field
             * @param {jQuery} $eyeIcon - The eye icon element
             */
            function togglePassword($input, $eyeIcon) {
                if ($input.attr('type') === 'password') {
                    $input.attr('type', 'text');
                    $eyeIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    $input.attr('type', 'password');
                    $eyeIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            }
            
            /**
             * Displays an error message
             * @param {jQuery} $errorElement - The error message container
             * @param {string} message - The error message to display
             */
            function showError($errorElement, message) {
                $errorElement.text(message).show();
            }
            
            /**
             * Hides all error messages
             */
            function hideErrorMessages() {
                $newPasswordError.hide();
                $confirmPasswordError.hide();
            }
            
            
            function savePassword() {
                const userEmail = getEmail();
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                
                // Final validation before submission
                if (newPassword.length < 8) {
                    showError($newPasswordError, 'Password must be at least 8 characters long');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    showError($confirmPasswordError, 'Passwords do not match');
                    return;
                }
                
                const strength = calculatePasswordStrength(newPassword);
                if (strength < 50) {
                    showError($newPasswordError, 'Please create a stronger password');
                    return;
                }
                
                // Show loading state
                const originalText = $saveBtn.text();
                $saveBtn.text('Saving...').prop('disabled', true);
                
                // AJAX call to backend
                $.ajax({
                    url: 'http://localhost:8080/auth/reset-password', 
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        email: userEmail,
                        newPassword: newPassword
                    }),
                    success: function (response) {
                        hideErrorMessages();
                        $successMessage.show();
                        $newPassword.val('');
                        $confirmPassword.val('');
                        $strengthIndicator.hide();
                        updateSaveButton();

                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 2000);
                    },
                    error: function (xhr) {
                        const res = xhr.responseJSON;
                        if (res && res.message) {
                            showError($newPasswordError, res.message);
                        } else {
                            showError($newPasswordError, 'Something went wrong');
                        }
                    },
                    complete: function () {
                        $saveBtn.text('Save').prop('disabled', false);
                    }
                });

                // Simulate API call with setTimeout
                // setTimeout(() => {
                //     // Restore button text
                //     $saveBtn.text(originalText);
                //     hideErrorMessages();
                    
                //     // Show success message
                //     $successMessage.show();
                    
                //     // Clear form fields
                //     $newPassword.val('');
                //     $confirmPassword.val('');
                //     $strengthIndicator.hide();
                //     updateSaveButton();
                    
                   
                    
                //     setTimeout(() => {
                //         // alert('Password reset complete! Redirecting to login page...');
                //         window.location.href = '../index.html';
                //     }, 2000);
                // }, 2000);
            }
        });
    </script>
</body>
</html>
