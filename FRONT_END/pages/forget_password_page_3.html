<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Global styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container styling */
        .container {
            background: #ffffff;
            border-radius: 25px;
            padding: 40px 35px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Header section */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
            text-align: center;
        }

        /* Lock icon styling */
        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .lock-icon::before {
            content: '';
            width: 35px;
            height: 25px;
            border: 4px solid #fff;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            position: absolute;
            top: 15px;
        }

        .lock-icon::after {
            content: '';
            width: 45px;
            height: 30px;
            background: #fff;
            border-radius: 8px;
            position: absolute;
            bottom: 15px;
        }

        .check-mark {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            border: 3px solid white;
        }

        /* Description text */
        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .password-input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 50px 15px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            background: #f8f9fa;
            transition: all 0.3s ease;
            outline: none;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .form-input:focus {
            border-color: #ffd700;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #333;
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 10px;
            font-size: 12px;
        }

        .strength-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak {
            background: #ff4757;
            width: 25%;
        }

        .strength-fair {
            background: #ffa502;
            width: 50%;
        }

        .strength-good {
            background: #2ed573;
            width: 75%;
        }

        .strength-strong {
            background: #1dd1a1;
            width: 100%;
        }

        .strength-text {
            color: #666;
            font-size: 11px;
        }

        /* Messages */
        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #2ed573;
            padding: 12px 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        /* Save button */
        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            border: none;
            border-radius: 15px;
            padding: 18px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.4);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2);
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .title {
                font-size: 16px;
            }
            
            .lock-icon {
                width: 70px;
                height: 70px;
            }
            
            .lock-icon::before {
                width: 30px;
                height: 22px;
                top: 12px;
            }
            
            .lock-icon::after {
                width: 38px;
                height: 25px;
                bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Main container for the password reset form -->
    <div class="container">
        <!-- Header section with title -->
        <div class="header">
            <h1 class="title">Create New Password</h1>
        </div>

        <!-- Lock icon with checkmark -->
        <div class="icon-container">
            <div class="lock-icon">
                <div class="check-mark">
                    <i class="fas fa-check"></i>
                </div>
            </div>
        </div>

        <!-- Description text -->
        <p class="description">
            Your New Password Must Be Different<br>
            from Previously Used Password.
        </p>

        <!-- Password reset form -->
        <form id="password-form">
            <!-- New password input field -->
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="password-input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="new-password"
                        required
                    >
                    <!-- Toggle password visibility button -->
                    <button type="button" class="toggle-password" id="toggle-new-password">
                        <i class="fas fa-eye" id="eye-new"></i>
                    </button>
                </div>
                <!-- Password strength indicator (hidden by default) -->
                <div class="password-strength" id="strength-indicator" style="display: none;">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                    <div class="strength-text" id="strength-text"></div>
                </div>
                <!-- Error message container -->
                <div class="error-message" id="new-password-error"></div>
            </div>

            <!-- Confirm password input field -->
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="password-input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="confirm-password"
                        required
                    >
                    <!-- Toggle password visibility button -->
                    <button type="button" class="toggle-password" id="toggle-confirm-password">
                        <i class="fas fa-eye" id="eye-confirm"></i>
                    </button>
                </div>
                <!-- Error message container -->
                <div class="error-message" id="confirm-password-error"></div>
            </div>

            <!-- Success message (hidden by default) -->
            <div class="success-message" id="success-message">
                Password updated successfully! You can now sign in with your new password.
            </div>

            <!-- Save button (disabled by default) -->
            <button type="submit" class="save-btn" id="save-btn" disabled>Save</button>
        </form>
    </div>

    <script>
        // Document ready function ensures code runs after DOM is fully loaded
        $(document).ready(function() {
            // Cache jQuery selectors for performance
            const $newPassword = $('#new-password');
            const $confirmPassword = $('#confirm-password');
            const $strengthIndicator = $('#strength-indicator');
            const $strengthFill = $('#strength-fill');
            const $strengthText = $('#strength-text');
            const $saveBtn = $('#save-btn');
            const $newPasswordError = $('#new-password-error');
            const $confirmPasswordError = $('#confirm-password-error');
            const $successMessage = $('#success-message');
            const $toggleNewPassword = $('#toggle-new-password');
            const $toggleConfirmPassword = $('#toggle-confirm-password');
            const $eyeNew = $('#eye-new');
            const $eyeConfirm = $('#eye-confirm');
            
            // Event handler for new password input
            $newPassword.on('input', function() {
                const password = $(this).val();
                hideErrorMessages();
                
                // Hide strength indicator if password is empty
                if (password.length === 0) {
                    $strengthIndicator.hide();
                    updateSaveButton();
                    return;
                }
                
                // Show and update password strength indicator
                $strengthIndicator.show();
                const strength = calculatePasswordStrength(password);
                updatePasswordStrength(strength);
                
                // Validate password meets minimum length requirement
                if (password.length < 8) {
                    showError($newPasswordError, 'Password must be at least 8 characters long');
                }
                
                updateSaveButton();
            });
            
            // Event handler for confirm password input
            $confirmPassword.on('input', function() {
                hideErrorMessages();
                validatePasswordMatch();
                updateSaveButton();
            });
            
            // Toggle password visibility for new password field
            $toggleNewPassword.on('click', function() {
                togglePassword($newPassword, $eyeNew);
            });
            
            // Toggle password visibility for confirm password field
            $toggleConfirmPassword.on('click', function() {
                togglePassword($confirmPassword, $eyeConfirm);
            });
            
            // Form submission handler
            $('#password-form').on('submit', function(event) {
                event.preventDefault();
                savePassword();
            });
            
            // Initialize the save button state
            updateSaveButton();
            
            /**
             * Calculates password strength based on various criteria
             * @param {string} password - The password to evaluate
             * @returns {number} Strength score from 0 to 100
             */
            function calculatePasswordStrength(password) {
                let score = 0;
                
                // Add points based on password characteristics
                if (password.length >= 8) score += 25;
                if (/[a-z]/.test(password)) score += 25;
                if (/[A-Z]/.test(password)) score += 25;
                if (/[0-9]/.test(password)) score += 25;
                
                return score;
            }
            
            /**
             * Updates the visual password strength indicator
             * @param {number} strength - Password strength score
             */
            function updatePasswordStrength(strength) {
                // Remove all strength classes before adding new one
                $strengthFill.removeClass('strength-weak strength-fair strength-good strength-strong');
                
                // Update strength indicator based on score
                if (strength <= 25) {
                    $strengthFill.addClass('strength-weak');
                    $strengthText.text('Weak password').css('color', '#ff4757');
                } else if (strength <= 50) {
                    $strengthFill.addClass('strength-fair');
                    $strengthText.text('Fair password').css('color', '#ffa502');
                } else if (strength <= 75) {
                    $strengthFill.addClass('strength-good');
                    $strengthText.text('Good password').css('color', '#2ed573');
                } else {
                    $strengthFill.addClass('strength-strong');
                    $strengthText.text('Strong password').css('color', '#1dd1a1');
                }
            }
            
            /**
             * Validates that password and confirmation match
             * @returns {boolean} True if passwords match, false otherwise
             */
            function validatePasswordMatch() {
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                
                // Show error if passwords don't match
                if (confirmPassword.length > 0 && newPassword !== confirmPassword) {
                    showError($confirmPasswordError, 'Passwords do not match');
                    return false;
                }
                
                return true;
            }
            
            /**
             * Updates the state of the save button based on form validity
             */
            function updateSaveButton() {
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                const strength = calculatePasswordStrength(newPassword);
                
                // Enable button only if all validation criteria are met
                const isValid = newPassword.length >= 8 && 
                               newPassword === confirmPassword && 
                               confirmPassword.length > 0 &&
                               strength >= 50;
                
                $saveBtn.prop('disabled', !isValid);
            }
            
            /**
             * Toggles password visibility
             * @param {jQuery} $input - The password input field
             * @param {jQuery} $eyeIcon - The eye icon element
             */
            function togglePassword($input, $eyeIcon) {
                if ($input.attr('type') === 'password') {
                    $input.attr('type', 'text');
                    $eyeIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    $input.attr('type', 'password');
                    $eyeIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            }
            
            /**
             * Displays an error message
             * @param {jQuery} $errorElement - The error message container
             * @param {string} message - The error message to display
             */
            function showError($errorElement, message) {
                $errorElement.text(message).show();
            }
            
            /**
             * Hides all error messages
             */
            function hideErrorMessages() {
                $newPasswordError.hide();
                $confirmPasswordError.hide();
            }
            
            /**
             * Handles form submission and password saving
             */
            function savePassword() {
                const newPassword = $newPassword.val();
                const confirmPassword = $confirmPassword.val();
                
                // Final validation before submission
                if (newPassword.length < 8) {
                    showError($newPasswordError, 'Password must be at least 8 characters long');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    showError($confirmPasswordError, 'Passwords do not match');
                    return;
                }
                
                const strength = calculatePasswordStrength(newPassword);
                if (strength < 50) {
                    showError($newPasswordError, 'Please create a stronger password');
                    return;
                }
                
                // Show loading state
                const originalText = $saveBtn.text();
                $saveBtn.text('Saving...').prop('disabled', true);
                
                // Simulate API call with setTimeout
                setTimeout(() => {
                    // Restore button text
                    $saveBtn.text(originalText);
                    hideErrorMessages();
                    
                    // Show success message
                    $successMessage.show();
                    
                    // Clear form fields
                    $newPassword.val('');
                    $confirmPassword.val('');
                    $strengthIndicator.hide();
                    updateSaveButton();
                    
                    // Clear any stored reset data
                    localStorage.removeItem('resetEmail');
                    
                    // Show redirect message after a delay
                    setTimeout(() => {
                        alert('Password reset complete! Redirecting to login page...');
                        // In a real application, you would redirect to the login page:
                        // window.location.href = '/login.html';
                    }, 2000);
                }, 2000);
            }
        });
    </script>
</body>
</html>
