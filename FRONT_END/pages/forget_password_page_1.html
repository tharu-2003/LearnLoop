<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="/css/forget_password_page_1.css">
</head>
<body>
    <div class="container">
        
        <div class="header">
            <button class="back-btn" id="back-button">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="title">Forgot Password</h1>
        </div>

        <div class="icon-container">
            <div class="lock-icon">
                <div class="check-mark">
                    <i class="fas fa-question"></i>
                </div>
            </div>
        </div>

        <p class="description">
            Please Enter Your Email Address To<br>
            Recieve a Verification Code.
        </p>

        <form id="forgot-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input 
                    type="email" 
                    class="form-input" 
                    placeholder="Enter your email address"
                    id="email-input"
                    required
                >
                <div class="error-message" id="email-error">Please enter a valid email address</div>
            </div>

            <button type="submit" class="send-btn">
                Send
                <div class="spinner"></div>
            </button>
        </form>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Document ready function using jQuery
        $(document).ready(function() {
            // Back button click event
            $('#back-button').click(function() {
                goBack();
            });
            
            // Form submission event
            $('#forgot-form').submit(function(event) {
                event.preventDefault();
                sendVerificationCode();
            });
            
            // Input focus effect using jQuery
            $('.form-input').focus(function() {
                $(this).css('border-color', '#ffd700');
                $('#email-error').hide();
                $(this).removeClass('input-error');
            }).blur(function() {
                $(this).css('border-color', '#e0e0e0');
            });
        });

        function goBack() {
            // Use history back as a safer alternative
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback to home page if no history
                window.location.href = '/';
            }
        }

        function showToast(message, type = '') {
            const toast = $('#toast');
            toast.removeClass('error success show');
            
            if (type) {
                toast.addClass(type);
            }
            
            toast.text(message);
            toast.addClass('show');
            
            setTimeout(() => {
                toast.removeClass('show');
            }, 3000);
        }

        function sendVerificationCode() {
            const email = $('#email-input').val().trim();
            
            if (!email) {
                $('#email-error').text('Please enter your email address').show();
                $('#email-input').addClass('input-error');
                return;
            }

            if (!isValidEmail(email)) {
                $('#email-error').text('Please enter a valid email address').show();
                $('#email-input').addClass('input-error');
                return;
            }

            // Show loading state with jQuery
            const btn = $('.send-btn');
            const spinner = $('.send-btn .spinner');
            const originalText = btn.text();
            
            btn.addClass('loading');
            spinner.show();
            btn.prop('disabled', true);

            // Simulate API call
            setTimeout(() => {
                btn.removeClass('loading');
                spinner.hide();
                btn.prop('disabled', false);
                
                // Store email for next page
                localStorage.setItem('resetEmail', email);
                
                showToast('Verification code sent successfully!', 'success');
                
                // Navigate to verify email page after a short delay
                setTimeout(() => {
                    window.location.href = '/pages/forget_password_page_3.html';
                }, 1500);
            }, 2000);
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>
</html>
