<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon"> -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<link rel="stylesheet" href="/css/index.css">

<title>Sign in & Sign up Form</title>
<link rel="icon" type="image/x-icon" href="/assets/images/AppIcon.png" style="border-radius: 100px;">
</head>
<body>
<div class="container">

  <div class="forms-container">
    <div class="signin-signup">

      <!-- SIGN IN FORM -->
      <form action="#" class="sign-in-form">
        <h2 class="title">Sign in</h2>
        <div class="input-field"><i class="fas fa-envelope"></i><input type="email" placeholder="Email" id="email" required /></div>
        <div class="input-field"><i class="fas fa-lock"></i><input type="password" placeholder="Password" id="login-password" required /></div>
        <div class="remember-row">
          <label class="control control-checkbox">Remember Me
            <input type="checkbox" />
            <div class="control_indicator"></div>
          </label>
          <a href="/pages/forget_password_page_1.html" class="forgot-pass">Forgot Password?</a>
        </div>
        <div class="error-message" id="login-error"></div>
        <input type="button" value="Login" class="btn" id="login-btn" />
        <p class="social-text">Or Sign in with social platforms</p>
        <div class="social-media">
          <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </form>

      <!-- SIGN UP FORM -->
      <form action="#" class="sign-up-form">
        <h2 class="title">Sign up</h2>
        <div class="input-field"><i class="fas fa-user"></i><input type="text" placeholder="Your Name" id="signup-username" required /></div>
        <div class="input-field"><i class="fas fa-envelope"></i><input type="email" placeholder="Email" id="signup-email" required /></div>
        <div class="input-field"><i class="fas fa-phone"></i><input type="text" placeholder="Phone Number" id="signup-phone" required /></div>

        <div class="input-field password-input-container">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Password" id="signup-password" required />
          <button type="button" class="password-toggle" data-target="signup-password"><i class="fas fa-eye"></i></button>
        </div>

        <div class="password-strength" id="strength-indicator">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-text" id="strength-text">Password strength</div>
        </div>

        <div class="input-field password-input-container">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Confirm Password" id="signup-confirm-password" required />
          <button type="button" class="password-toggle" data-target="signup-confirm-password"><i class="fas fa-eye"></i></button>
        </div>

        <div class="password-error-message" id="confirm-password-error"></div>

        <div class="toggle-container" id="toggleContainer">
          <button class="toggle-button off">Teacher</button>
          <button class="toggle-button on">Student</button>
        </div>

        <div class="error-message" id="signup-error"></div>
        <input type="button" value="Sign up" class="btn" id="signup-btn" />
        <div class="success-message" id="success-message"></div>
      </form>

    </div>
  </div>

  <div class="panels-container">
    <div class="panel left-panel">
      <div class="content">
        <h3>New here?</h3>
        <p>Sign up and start your journey!</p>
        <button class="btn transparent" id="sign-up-btn">Sign up</button>
      </div>
      <img src="/assets/images/log.svg" class="image" alt="" />
    </div>
    <div class="panel right-panel">
      <div class="content">
        <h3>One of us?</h3>
        <p>To keep connected with us please login with your personal info.</p>
        <button class="btn transparent" id="sign-in-btn">Sign in</button>
      </div>
      <img src="/assets/images/register.svg" class="image" alt="" />
    </div>
  </div>
</div>

<script src="/js/index.js"></script>
</body>
</html>
