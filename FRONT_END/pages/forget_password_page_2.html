<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
    <title>Verify Your Email</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add jQuery library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <link rel="stylesheet" href="/css/forget_password_page_2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" id="back-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="title">Verify Your Email</h1>
        </div>

        <div class="icon-container">
            <div class="email-icon">
                <div class="email-wings">
                    <div class="wing-left"></div>
                    <div class="wing-right"></div>
                </div>
            </div>
        </div>

        <p class="description">
            Please Enter The 4 Digit Code Sent To<br>
            <span class="email-address" id="user-email">@gmail.com</span>
        </p>

        <form id="verify-form">
            <div class="otp-container">
                <input type="text" class="otp-input" maxlength="1" id="otp1">
                <input type="text" class="otp-input" maxlength="1" id="otp2">
                <input type="text" class="otp-input" maxlength="1" id="otp3">
                <input type="text" class="otp-input" maxlength="1" id="otp4">
            </div>
            <div class="otp-underline"></div>

            <div class="resend-container">
                <a href="#" class="resend-link" id="resend-link">Resend Code</a>
                <div class="timer" id="timer" style="display: none;">
                    Resend in <span id="countdown">60</span>s
                </div>
            </div>

            <button type="submit" class="verify-btn" id="verify-btn">Verify</button>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            let timeLeft = 60;
            let timerInterval;
            const otpInputs = $('.otp-input');
            
            // Auto-focus and navigation for OTP inputs
            otpInputs.on('input', function(e) {
                const $this = $(this);
                const value = $this.val();
                const index = otpInputs.index(this);
                
                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    $this.val('');
                    return;
                }
                
                // Add filled class for styling
                if (value) {
                    $this.addClass('filled');
                    // Move to next input
                    if (index < 3) {
                        otpInputs.eq(index + 1).focus();
                    }
                } else {
                    $this.removeClass('filled');
                }
                
                updateVerifyButton();
            });
            
            otpInputs.on('keydown', function(e) {
                const index = otpInputs.index(this);
                
                // Handle backspace
                if (e.key === 'Backspace' && $(this).val() === '' && index > 0) {
                    otpInputs.eq(index - 1).focus();
                    otpInputs.eq(index - 1).removeClass('filled');
                }
                
                // Prevent non-numeric input
                if (!/[\d\b]/.test(e.key) && !['ArrowLeft', 'ArrowRight', 'Delete', 'Tab'].includes(e.key)) {
                    e.preventDefault();
                }
            });
            
            // Load email from previous page
            const storedEmail = localStorage.getItem('resetEmail');
            if (storedEmail) {
                $('#user-email').text(storedEmail);
            }
            
            // Focus first input
            otpInputs.first().focus();
            
            // Start timer
            startResendTimer();
            
            // Back button click event
            $('#back-btn').on('click', goBack);
            
            // Resend link click event
            $('#resend-link').on('click', resendCode);
            
            // Form submit event
            $('#verify-form').on('submit', verifyCode);
            
            // Pre-fill demo code (5484) for testing - remove in production
            setTimeout(() => {
                // $('#otp1').val('*');
                // $('#otp2').val('*');
                // $('#otp3').val('*');
                // $('#otp4').val('*');
                
                otpInputs.each(function() {
                    if ($(this).val()) {
                        $(this).addClass('filled');
                    }
                });
                
                updateVerifyButton();
            }, 1000);
            
            function updateVerifyButton() {
                const code = getOTPCode();
                const verifyBtn = $('#verify-btn');
                
                if (code.length === 4) {
                    verifyBtn.prop('disabled', false);
                } else {
                    verifyBtn.prop('disabled', true);
                }
            }
            
            function getOTPCode() {
                return otpInputs.map(function() {
                    return $(this).val();
                }).get().join('');
            }
            
            function startResendTimer() {
                const resendLink = $('#resend-link');
                const timer = $('#timer');
                const countdown = $('#countdown');
                
                resendLink.addClass('disabled');
                resendLink.css('pointer-events', 'none');
                timer.show();
                
                timeLeft = 60;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    countdown.text(timeLeft);
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        resendLink.removeClass('disabled');
                        resendLink.css('pointer-events', 'auto');
                        timer.hide();
                    }
                }, 1000);
            }
            
            function resendCode(event) {
                event.preventDefault();
                
                if (timeLeft > 0) return;
                
                alert('Resending verification code...');
                
                // Clear current inputs
                otpInputs.val('');
                otpInputs.removeClass('filled');
                
                // Focus first input
                otpInputs.first().focus();
                
                // Restart timer
                startResendTimer();
                updateVerifyButton();
            }
            
            function goBack() {
                clearInterval(timerInterval);
                // alert('Going back to forgot password page...');
                window.location.href = '/pages/forget_password_page_1.html';
            }
            
            function verifyCode(event) {
                event.preventDefault();
                
                const code = getOTPCode();
                
                if (code.length !== 4) {
                    alert('Please enter the complete 4-digit code.');
                    return;
                }
                
                // Show loading state
                const btn = $('#verify-btn');
                const originalText = btn.text();
                btn.text('Verifying...');
                btn.prop('disabled', true);
                
                // Simulate API call
                setTimeout(() => {
                    // Demo: accept code 5484 or any 4-digit code for testing
                    if (code === '5484' || code.length === 4) {
                        clearInterval(timerInterval);
                        alert('Code verified successfully! Navigating to create new password...');
                        window.location.href = '/pages/forget_password_page_3.html';

                    } else {
                        btn.text(originalText);
                        btn.prop('disabled', false);
                        alert('Invalid verification code. Please try again.');
                        
                        // Clear inputs and restart
                        otpInputs.val('');
                        otpInputs.removeClass('filled');
                        otpInputs.first().focus();
                        updateVerifyButton();
                    }
                }, 2000);
            }
        });
    </script>
</body>
</html>
